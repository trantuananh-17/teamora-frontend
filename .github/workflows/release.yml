# Tag → image → environment.
#
#   v1.2.0      production
#   v1.2.0rc1   staging
#
# The tag shape is the only thing that selects the environment. Both forms of
# release candidate are accepted (`rc1` and `-rc.1`) so a tag can never be
# pushed and then silently do nothing.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # production
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+" # staging
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+" # staging

jobs:
  # A tag must clear the same gate a pull request does. Skipping it here is how
  # a release ships something main never accepted.
  check:
    uses: ./.github/workflows/check.yml

  build:
    name: Build and push
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish to GHCR as the workflow's own token
    outputs:
      image: ${{ steps.meta.outputs.image }}
      environment: ${{ steps.meta.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target environment and image reference
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          # `rc` anywhere in the tag means release candidate, which means staging.
          if [[ "$VERSION" == *rc* ]]; then
            ENVIRONMENT=staging
          else
            ENVIRONMENT=production
          fi
          # GHCR rejects uppercase; the owner segment is user-controlled.
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          echo "version=$VERSION"          >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT"  >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE:$VERSION"     >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION to $ENVIRONMENT as $IMAGE:$VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args. Everything the browser may see is serialized at request
      # time by EnvScript, which is what lets this one image serve staging and
      # production without being rebuilt.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Released \`${{ github.ref_name }}\` → ${{ steps.meta.outputs.environment }}"
            echo
            echo "Image: \`${{ steps.meta.outputs.image }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    uses: ./.github/workflows/deploy-template.yml
    with:
      environment: ${{ needs.build.outputs.environment }}
      version: ${{ github.ref_name }}
      image: ${{ needs.build.outputs.image }}
      tag_var: IMAGE_TAG_FRONTEND
      services: web
      # No migrate_run: this repository owns no schema.
      #
      # /api/health is this app's own Hono proxy and reaches no backend, so a
      # green answer means the web container is serving — the API's own health
      # is the backend deploy's business.
      health_url: http://localhost:3000/api/health
    secrets: inherit
